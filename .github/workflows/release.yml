name: release

# Build the Windows x64 installer and publish a GitHub Release when a version
# tag is pushed, e.g.  git tag v0.1.0 && git push origin v0.1.0
# It can also be run by hand (Actions → release → Run workflow) on any branch;
# the tag is then created at that branch's head if it does not exist yet.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Claude Usage Widget ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Download the installer below (`*-setup.exe`).

            The build is unsigned, so Windows SmartScreen may warn on first run —
            click **More info → Run anyway**.
          releaseDraft: false
          prerelease: false
